name: Publish image

# Builds an app image under images/<app>/ and publishes it to GHCR as
# ghcr.io/spore-host/<app>. Triggered by a tag `<app>-v<version>` (e.g.
# `openrefine-v3.10.1`) or manually via workflow_dispatch.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      app:
        description: "App directory under images/ (e.g. openrefine)"
        required: true
      version:
        description: "Image version tag (e.g. 3.10.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve app + version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            app="${{ github.event.inputs.app }}"
            version="${{ github.event.inputs.version }}"
          else
            # Tag form: <app>-v<version>  (e.g. openrefine-v3.10.1)
            ref="${GITHUB_REF_NAME}"
            app="${ref%-v*}"
            version="${ref##*-v}"
          fi
          if [ ! -d "images/${app}" ]; then
            echo "::error::images/${app} does not exist"; exit 1
          fi
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building images/${app} → ghcr.io/${{ github.repository_owner }}/${app}:${version}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ steps.meta.outputs.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.app }}:latest
